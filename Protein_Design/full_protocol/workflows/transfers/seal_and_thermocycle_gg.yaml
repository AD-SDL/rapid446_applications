name: seal_and_thermocycle_pcr

metadata:
  author: Abe Stroka
  info: Workflow for transfering pcr plate from ot2 to thermocycler
  version: '0.1'


steps:
  - name: open biometra
    node: biometra_beuford_96
    action: open_lid
    args:
      plate_type: 96

  - name: transfer from ot2 to exchange
    node: pf400_piper
    action: transfer
    locations:
      target: exchange_nest_high_wide
      source: ot2_patrick_nest6_temp_block_wide

  - name: exchange to sealer
    node: pf400_piper
    action: transfer
    locations:
      source: exchange_nest_high_narrow
      target: sealer_nest


  - name: seal
    node: sealer_sassy
    action: seal
    comment: seal the pcr plate


  - name: sealer_to_exchange
    node: pf400_piper
    action: transfer
    locations:
      source: sealer_nest
      target: exchange_nest_high_narrow


  - name: exchange to thermocycler
    node: pf400_piper
    action: transfer
    locations:
      source: exchange_nest_high_wide
      target: bio_biometra3_nest


  - name: close biometra
    node: biometra_beuford_96
    action: close_lid
    args:
      plate_type: 96


