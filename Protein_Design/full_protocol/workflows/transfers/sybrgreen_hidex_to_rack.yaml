name: sybrgreen_ot2_to_hidex

metadata:
  author: Abe Stroka
  info: Workflow for transfering sybrgreen plate from flex to hidex
  version: '0.1'


steps:
  - name: open hidex
    node: hidex_geraldine
    action: open

  - name: transfer from hidex to rack
    node: pf400_piper
    action: transfer
    locations:
      target: rack1_row2_nest1
      source: hidex_geraldine.hidex_carriage


  - name: close hidex
    node: hidex_geraldine
    action: close

