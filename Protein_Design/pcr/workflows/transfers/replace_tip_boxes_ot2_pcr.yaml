name: Replace tip boxes OT2 PCR

metadata:
  author: Abe Stroka
  info: Workflow for removing 2 empty tip boxes from ot2 and placing one new one
  version: '0.1'


steps:
  #transfer empty box 1 to exchange
  - name: Transfer empty tip box 1 to exchange
    node: pf400_piper
    action: transfer
    args:
      source_plate_rotation: wide
      target_plate_rotation: wide
      # source_approach_height_offset: 10
    locations:
      source: ot2_patrick_nest1_wide
      target: exchange_nest_high_wide
      source_approach: safe_path_ot2_patrick_nest1_high
      target_approach: safe_path_exchange
    

  #transfer empty box 1 from exchange to rack
  - name: Transfer box to rack
    node: pf400_piper
    action: transfer
    args:
      source_plate_rotation: narrow
      target_plate_rotation: narrow
    locations:
      source: exchange_nest_high_narrow
      target: #TODO: rack_1
      source_approach: safe_path_exchange
      target_approach: safe_path_rack1
  
  #transfer empty box 2 to exchange
  - name: Transfer empty tip box 2 to exchange
    node: pf400_piper
    action: transfer
    args:
      source_plate_rotation: wide
      target_plate_rotation: wide
      # source_approach_height_offset: 10
    locations:
      source: ot2_patrick_nest3_wide
      target: exchange_nest_high_wide
      source_approach: safe_path_ot2_patrick_nest3_high
      target_approach: safe_path_exchange
  

  #transfer empty box 2 from exchange to rack
  - name: Transfer box to rack
    node: pf400_piper
    action: transfer
    args:
      source_plate_rotation: narrow
      target_plate_rotation: narrow
    locations:
      source: exchange_nest_high_narrow
      target: #TODO: rack_1
      source_approach: safe_path_exchange
      target_approach: safe_path_rack2
  
  #transfer fresh tip box to position 3
  - name: Transfer fresh box from rack to exchange
    node: pf400_piper
    action: transfer
    args:
      source_plate_rotation: narrow
      target_plate_rotation: narrow
    locations:
      source: #TODO: rack_3
      target: exchange_nest_high_narrow
      source_approach: safe_path_rack3
      target_approach: safe_path_exchange


  - name: Transfer fresh tip box from exchange to ot2 3
    node: pf400_piper
    action: transfer
    args:
      source_plate_rotation: wide
      target_plate_rotation: wide
      # source_approach_height_offset: 10
    locations:
      source: exchange_nest_high_wide
      target: ot2_patrick_nest3_wide
      source_approach: safe_path_exchange
      target_approach: safe_path_ot2_patrick_nest3_high

