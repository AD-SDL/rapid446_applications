name: sybrgreen_ot2_to_hidex

metadata:
  author: Abe Stroka
  info: Workflow for transfering sybrgreen plate from flex to hidex
  version: '0.1'


steps:
  - name: open hidex
    node: hidex_geraldine
    action: open

  - name: transfer from ot2 to exchange
    node: pf400_piper
    action: transfer
    locations:
      target: exchange_narrow
      source: otflex_sandy.deck_nest_A4

  - name: exchange to hidex
    node: pf400_piper
    action: transfer
    locations:
      source: exchange_narrow
      target: hidex_geraldine.hidex_carriage


  - name: close hidex
    node: hidex_geraldine
    action: close




