name: biometra_96 to ot2

metadata:
  author: Abe Stroka
  info: Workflow for removing golden gate plate from thermocycler to ot2 deck 6 temp block
  version: '0.1'

steps:
  - name: open biometra
    node: biometra_beuford_96
    action: open_lid
    args:
      plate_type: 96

  #peel plate
  
  - name: transfer
    module: pf400_piper
    action: transfer
    args:
      source_plate_rotation: wide
      target_plate_rotation: wide
    target:
      source: bio_biometra3_nest
      target: exchange_deck_high_wide
      source_approach: safe_path_biometra3
      target_approach: safe_path_exchange
    comment: moves plate from biometra 96 thermocycler to exchange

  
  - name: transfer
    module: pf400_piper
    action: transfer
    args:
      source_plate_rotation: narrow
      target_plate_rotation: narrow
    target:
      source: exchange_deck_high_narrow
      target: peeler_nest
      source_approach: safe_path_exchange
      target_approach: safe_path_peeler
    comment: transfer to peeler

  
  - name: peel
    module: bio_peeler
    action: peel
    args:
      foo: bar
    comment: peel the pcr plate
  

  #peeler to exchange
  - name: transfer
    module: pf400_piper
    action: transfer
    args:
      source_plate_rotation: narrow
      target_plate_rotation: narrow
    target:
      source: peeler_nest
      target: exchange_deck_high_narrow
      source_approach: safe_path_peeler
      target_approach: safe_path_exchange
    comment: moves plate from exchange to biometra 96 thermocycler

  #exchange to ot2
  - name: transfer
    module: pf400_piper
    action: transfer
    args:
      target_approach_height_offset: 10
      source_plate_rotation: wide
      target_plate_rotation: wide
    locations:
      source_approach: safe_path_exchange
      target_approach: safe_path_ot2_patrick_nest6_high
      source: exchange_deck_high_wide
      target: ot2_patrick_nest6_temp_block_wide
    comment: place plate on flex
