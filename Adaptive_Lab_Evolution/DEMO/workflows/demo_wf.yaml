name: Adaptive Lab Evolution - Demo Workflow

metadata:
  author: Casey Stone
  info: Demo Workflow
  version: '0.1'

parameters:
  file_inputs:
    - key: ot2_protocol


steps:
  # Start with plate with lid on exchange

  # Remove the lid to lid nest 3
  - name: remove lid from plate on exchange
    node: pf400_piper
    action: remove_lid
    locations:
      source: exchange_narrow
      target: rack1_row1_nest1

  # Transfer into OT-2 nest 3
  - name: Transfer to OT-2
    node: pf400_piper
    action: transfer
    locations:
      source: exchange_wide
      target: ot2_spongebob.deck_nest_3

  # Run OT-2 protocol
  - name: Run OT-2 spongebob
    node: ot2_spongebob
    action: run_protocol
    files:
      protocol: ot2_protocol

  # Open BMG tray
  - name: Open the BMG plate reader tray
    node: bmg_billy
    action: open

  # Transfer plate from ot2 to exchange
  - name: Transfer plate without lid to exchange location
    node: pf400_piper
    action: transfer
    locations:
      source: ot2_spongebob.deck_nest_3
      target: exchange_wide

  # Transfer plate without lid to bmg nest
  - name: Transfer plate without lid to bmg nest
    node: pf400_piper
    action: transfer
    locations:
      source: exchange_narrow
      target: bmg_billy.bmg_carriage

  # Close BMG tray
  - name: Close the BMG reader tray
    node: bmg_billy
    action: close

  # Open BMG tray
  - name: Open the BMG plate reader tray
    node: bmg_billy
    action: open

  # Transfer from BMG to exchange
  - name: Transfer plate without lid from bmg to exchange
    node: pf400_piper
    action: transfer
    locations:
      source: bmg_billy.bmg_carriage
      target: exchange_narrow

  # Replace the lid
  - name: replace lid
    node: pf400_piper
    action: replace_lid
    locations:
      source: rack1_row1_nest1
      target: exchange_narrow

  # Open incubator
  - name: open incubator
    node: inheco_iris_2.1
    action: open

  # Transfer from exchange to incubator # WORKS BUT RECALIBRATE! WAS VERY OFF!
  - name: transfer
    node: pf400_piper
    action: transfer
    locations:
      source: exchange_narrow
      target: inheco_iris_2.1.inheco_carriage

  # Close incubator
  - name: close incubator
    node: inheco_iris_2.1
    action: close

  # Close BMG tray
  - name: close bmg
    node: bmg_billy
    action: close

  # Incubate for specified time
  - name: run incubation
    node: inheco_iris_2.1
    action: incubate
    args:
      temperature: 30.0
      shaker_frequency: 6.6
      wait_for_incubation_time: True
      incubation_time: 20

  # Open incubator  # WORKS!
  - name: open incubator
    node: inheco_iris_2.1
    action: open

  # Transfer to exchange
  - name: transfer to exchange
    node: pf400_piper
    action: transfer
    locations:
      source: inheco_iris_2.1.inheco_carriage
      target: exchange_narrow

  # Close incubator
  - name: close incubator
    node: inheco_iris_2.1
    action: close







