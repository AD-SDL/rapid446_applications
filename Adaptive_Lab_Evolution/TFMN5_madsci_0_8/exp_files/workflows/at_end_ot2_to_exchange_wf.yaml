name: FINAL WORKFLOWS - OT-2 to exchange, replace lid WF

metadata:
  author: Casey Stone
  info: Workflow for moving final plate to exchange
  version: 0.1

parameters:
  json_inputs:
    - key: ot2_location
    - key: lid_location

steps:
  # 0. Transfer from OT-2 to exchange
  - name: transfer from OT-2 to exchange
    node: pf400_piper
    action: transfer
    locations:
      target: exchange_wide
    params:
      locations:
        source: ot2_location
    conditions:
    - condition_type: no_resource_present
      location_name: exchange_wide

  # 1. Replace the lid
  - name: replace lid on exchange
    node: pf400_piper
    action: replace_lid
    locations:
      target: exchange_narrow
    params:
      locations:
        source: lid_location
