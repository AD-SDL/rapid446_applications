name: empty cfps to flex

metadata:
  author: Abe Stroka
  info: empty pcr plate to flex cooling block
  version: '0.1'

steps:
  #fragments plate from nest 4 ot2 to flex cooling block
  - name: transfer
    node: pf400_piper
    action: transfer
    args:
      # source_approach_height_offset: 10
      source_plate_rotation: narrow
      target_plate_rotation: narrow
    locations:
      source_approach: safe_path_rack1_row4_nest2
      target_approach: safe_path_exchange
      source: rack1_row4_nest2
      target: exchange_nest_low_narrow
    comment: place plate on exchange


  - name: transfer
    node: pf400_piper
    action: transfer
    args:
      source_plate_rotation: narrow
      target_plate_rotation: narrow
    locations:
      source: exchange_nest_low_narrow
      target: otflex_sandy_nestA
      source_approach: safe_path_exchange
      target_approach: safe_path_otflex_sandy_nestA
    comment: moves plate from exchange to flex A

