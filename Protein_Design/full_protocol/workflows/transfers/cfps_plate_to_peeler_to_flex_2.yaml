name: pcr from exchange to ot2

metadata:
  author: Abe Stroka
  info: Workflow for transfering pcr plate from flex to cool block on ot2 nest 4
  version: '0.1'


steps:
  - name: transfer
    node: pf400_piper
    action: transfer
    locations:
      source: exchange_nest_low_narrow
      target: peeler_nest
    comment: transfer to peeler


  - name: peel
    node: bio_peeler
    action: peel
    comment: peel the pcr plate


  #peeler to exchange
  - name: transfer
    node: pf400_piper
    action: transfer
    locations:
      source: peeler_nest
      target: exchange_nest_high_narrow
    comment: moves plate from exchange to biometra 96 thermocycler

  - name: transfer
    node: pf400_piper
    action: transfer
    locations:
      source: exchange_nest_low_narrow
      target: otflex_sandy_nestA
    comment: moves plate from exchange to flex A