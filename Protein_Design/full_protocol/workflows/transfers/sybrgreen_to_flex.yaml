name: sybrgreen_to_flex

metadata:
  author: Abe Stroka
  info: Workflow for transfering controls plate from rack to flex
  version: '0.1'

steps:
  #fragments plate from nest 4 ot2 to flex cooling block
  - name: transfer
    node: pf400_piper
    action: transfer
    locations:
      source: rack_row3_nest2
      target: exchange_nest_low_narrow
    comment: place plate on exchange


  - name: transfer
    node: pf400_piper
    action: transfer
    locations:
      source: exchange_nest_low_narrow
      target: otflex_sandy_nestA
    comment: moves plate from exchange to flex A

