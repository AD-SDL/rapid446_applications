
name: FINAL WORKFLOWS - Transfer from exchange to trash stack

metadata:
  author: Casey Stone
  info: Transfer from exchange to trash stack
  version: '0.1'


parameters:
  json_inputs:
    - key: sciclops_stack_old_plates

steps:
  # 0. Transfer from exchange to SciClops exchange
  - name: transfer to sciclops exchange
    node: pf400_piper
    action: transfer
    locations:
      source: exchange_wide
      target: sciclops_plankton.exchange 

  # 1. Return old plate to stack
  - name: transfer to stack
    node: sciclops_plankton
    action: transfer
    locations:
      source: sciclops_plankton.exchange
    params:
      locations:
        target: sciclops_stack_old_plates

  # 2. Move SciClops to Safe
  - name: move safe
    node: sciclops_plankton
    action: move
    locations:
      location: sciclops_plankton.safe