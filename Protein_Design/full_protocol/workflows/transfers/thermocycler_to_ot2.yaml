name: biometra_96 to ot2

metadata:
  author: Abe Stroka
  info: Workflow for removing golden gate plate from thermocycler to ot2 nest 6 temp block
  version: '0.1'


steps:
  - name: open biometra
    node: biometra_beuford_96
    action: open_lid
    args:
      plate_type: 96

  #peel plate

  - name: transfer
    node: pf400_piper
    action: transfer
    locations:
      source: bio_biometra3_nest
      target: exchange_nest_high_wide



  - name: transfer
    node: pf400_piper
    action: transfer
    locations:
      source: exchange_nest_low_narrow
      target: peeler_nest
    comment: transfer to peeler


  - name: peel
    node: bio_peeler
    action: peel
    comment: peel the pcr plate


  #peeler to exchange
  - name: transfer
    node: pf400_piper
    action: transfer
    locations:
      source: peeler_nest
      target: exchange_nest_high_narrow
    comment: moves plate from exchange to biometra 96 thermocycler

  #exchange to ot2
  - name: transfer
    node: pf400_piper
    action: transfer
    locations:
      source: exchange_nest_high_wide
      target: ot2_patrick_nest6_temp_block_wide
    comment: place plate on flex
