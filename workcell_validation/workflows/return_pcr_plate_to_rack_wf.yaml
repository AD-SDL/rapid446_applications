name: Return PCR Plate to Rack Row 1 Nest 2 Workflow

metadata:
  author: Casey Stone
  info: A Workcell Validation Workflow
  version: 0.1

steps:
  - name: Transfer to Rack Row 1 Nest 2
    node: pf400_piper
    action: transfer
    args:
      source_plate_rotation: narrow
      target_plate_rotation: narrow
    locations:
      source: exchange_nest_low_narrow
      target: rack_row1_nest2
      source_approach: safe_path_exchange
      target_approach: safe_path_rack_row1_nest2