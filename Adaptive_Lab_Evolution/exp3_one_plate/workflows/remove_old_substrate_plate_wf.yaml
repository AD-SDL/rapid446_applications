name: Remove old substrate plate to tower WF

metadata:
  author: Casey Stone
  info: Workflow for using PF400 to remove old substrate plate from OT-2 back to tower
  version: '0.1'

parameters:
  json_inputs:
    - key: ot2_location
    - key: ot2_safe_path
    - key: lid_location
    - key: lid_safe_path
    - key: current_tower_nest
    - key: current_tower_nest_safe_path

steps:
  # Transfer from OT-2 to exchange
  - name: transfer from ot2 to exchange
    node: pf400_piper
    action: transfer
    args:
      source_plate_rotation: wide
      target_plate_rotation: wide
    locations:
      target: exchange_nest_high_wide
      target_approach: safe_path_exchange
    params:
      locations:
        source: ot2_location
        source_approach: ot2_safe_path

  # Replace lid on exchange
  - name: replace lid
    node: pf400_piper
    action: replace_lid
    args:
      source_plate_rotation: wide
      target_plate_rotation: wide
      lid_height: 8
    locations:
      target: exchange_nest_low_wide
      target_approach: safe_path_exchange
    params:
      locations:
        source: lid_location
        source_approach: lid_safe_path

  # Return old plate to tower
  - name: transfer old plate to tower
    node: pf400_piper
    action: transfer
    args:
      source_plate_rotation: narrow
      target_plate_rotation: narrow
    locations:
      source: exchange_nest_low_narrow
      source_approach: safe_path_exchange
    params:
      locations:
        target: current_tower_nest
        target_approach: current_tower_nest_safe_path
