name: fragments_and_empty_to_flex

metadata:
  author: Abe Stroka
  info: Workflow for transfering fragments plate from ot2 to flex, and empty pcr plate to flex cooling block
  version: '0.1'

steps:

  - name: transfer from ot2 to exchange
    node: pf400_piper
    action: transfer
    locations:
      target: exchange_nest_high_wide
      source: ot2_patrick_nest4_temp_block_wide

  - name: exchange to sealer
    node: pf400_piper
    action: transfer
    locations:
      source: exchange_nest_high_narrow
      target: sealer_nest


  - name: seal
    node: sealer_sassy
    action: seal
    comment: seal the pcr plate


  - name: sealer_to_exchange
    node: pf400_piper
    action: transfer
    locations:
      source: sealer_nest
      target: exchange_nest_high_narrow

  - name: transfer
    node: pf400_piper
    action: transfer
    locations:
      source: exchange_nest_low_narrow
      target: otflex_sandy_nestA
    comment: moves plate from exchange to flex A

