name: FINAL WORKFLOW - OT-2 to exchange, replace lid WF

metadata:
  author: Casey Stone
  info: Workflow for moving final plate to exchange
  version: 0.1

parameters:
  json_inputs:
    - key: ot2_location
    - key: ot2_safe_path
    - key: lid_location
    - key: lid_safe_path


steps:
  # 0. Transfer from OT-2 to exchange.  # TEST PARAMS SYNTAX
  - name: transfer from OT-2 to exchange
    node: pf400_piper
    action: transfer
    args:
      source_plate_rotation: wide
      target_plate_rotation: wide
    locations:
      target: exchange_nest_high_wide
      target_approach: safe_path_exchange
    params:
      locations:
        source: ot2_location
        source_approach: ot2_safe_path

  # 1. Replace the lid
  - name: replace lid on exchange
    node: pf400_piper
    action: replace_lid
    args:
      source_plate_rotation: wide
      target_plate_rotation: wide
      lid_height: 8
    locations:
      target: exchange_nest_low_wide
      target_approach: safe_path_exchange
    params:
      locations:
        source: payload.lid_location
        source_approach: payload.lid_safe_path
